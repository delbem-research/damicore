[project]
name = "synthetic-data"
version = "0.1.0"
description = "Internal-only synthetic dataset generator for exercising the DAMICORE packages in tests. Not published, not a runtime dependency of any damicore-* package."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Ennio Politi Lopes", email = "enniolopes@users.noreply.github.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = []

[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

# Workspace-only files are excluded on purpose: each package's Makefile only includes
# ../package.mk, pyrightconfig.json extends ../../pyrightconfig.json, and tests/ depends
# on the workspace conftest and dev tooling, so none of them work in an sdist unpacked
# outside the monorepo. The repository .gitignore still ships: hatchling force-includes
# the located VCS ignore file so an sdist-to-wheel build selects files the same way, and
# `exclude` deliberately cannot override that.
[tool.hatch.build.targets.sdist]
exclude = ["Makefile", "pyrightconfig.json", "tests"]

# Ruff resolves configuration per file, and its isort infers first-party packages from `src`
# relative to the file holding that configuration. This section is therefore not a copy of
# the root's for its own sake: it is what makes `damicore_normalizer` and its siblings sort
# as the separate distributions they are, in the third-party block, while this package's own
# modules stay first party. Held equal to the other members by tests/architecture.
[tool.ruff]
line-length = 100
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "RUF100", "UP"]
