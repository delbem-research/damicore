name: Refresh tornado lock

on:
  push:
    branches: [fix/tornado-6.5.8]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/uv-workspace
        with:
          sync: none
      - run: uv lock --upgrade-package tornado
      - run: git diff --check
      - name: Commit lock update
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "fix(deps): update tornado lock"
          git push
