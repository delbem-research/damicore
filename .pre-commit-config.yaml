# Run `pre-commit autoupdate` to refresh revs to latest stable versions.
#
# Strategy:
#   Auto-fix what can be fixed (ruff lint fixable rules, ruff format, whitespace)
#   Block what cannot (unfixable lint errors, secrets, large files, bad yaml/toml)
#   pyright and pytest are NOT here — too slow; they run via `make check`/`make test` and CI.
# `commit-msg` is listed so `pre-commit install` wires it: without it only the pre-commit
# stage is installed and the message hook never runs.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Ruff runs from the workspace, at the version uv.lock resolves, rather than from a hook
  # repository with its own pin. Two pins for one tool drifted: dependabot moved the hook to
  # 0.17 while the workspace range stayed below it, the two sorted one import differently,
  # and the hook rewrote a file `make check` accepts. One version cannot disagree with itself.
  - repo: local
    hooks:
      # Auto-fix import sorting, unused imports, and other fixable lint rules.
      # --exit-non-zero-on-fix: if files were modified, fail so developer sees
      # the changes, stages them (git add -u), and retries the commit.
      - id: ruff
        name: ruff
        language: system
        entry: uv run --frozen ruff check --fix --exit-non-zero-on-fix
        types_or: [python, pyi]
      # Auto-format. Same mechanic: modifies files → commit fails → add + retry.
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --frozen ruff format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A two-space line ending in Markdown is a hard line break, not stray whitespace.
      # This keeps the hook from rewriting rendering while still trimming real trailing
      # whitespace everywhere else.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      # Block accidental large dataset commits. Fixtures up to 2 MB are allowed;
      # raw research data must live outside the repo or in git-lfs.
      - id: check-added-large-files
        args: [--maxkb=2000]
      # Block committing private keys or credentials.
      - id: detect-private-key

  # `AGENTS.md` requires Conventional Commits and nothing held it. A local pygrep hook
  # rather than commitizen: the rule is one regular expression, and a hook repository is a
  # dependency to pin, update and trust for what fits on a line. `--negate` fails when the
  # subject does NOT match, and without `--multiline` the pattern is anchored to the first
  # line, which is the subject.
  - repo: local
    hooks:
      - id: conventional-commit
        name: the commit subject is a Conventional Commit
        language: pygrep
        entry: '^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._-]+\))?!?: .+|Merge |Revert )'
        args: [--negate]
        stages: [commit-msg]
